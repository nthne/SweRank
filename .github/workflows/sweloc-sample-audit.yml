name: SWELOC sample audit
on:
  workflow_dispatch:
    inputs:
      repo:
        description: Public repo owner/name
        required: true
        default: pallets/flask
      max_prs:
        description: Max merged linked PRs
        required: true
        default: '4'
  push:
    paths:
      - src/collect/enrich_sweloc.py
      - src/collect/llm_audit_budget.py
      - tests/test_llm_audit_budget.py
      - src/collect/group_issues.py
      - .github/workflows/sweloc-sample-audit.yml
permissions:
  contents: write
concurrency:
  group: sweloc-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TARGET_REPO: ${{ inputs.repo || 'pallets/flask' }}
      MAX_PRS: ${{ inputs.max_prs || '4' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Crawl issue and PR
        run: |
          python src/collect/sample_sweloc.py --repo "$TARGET_REPO" --max-prs "$MAX_PRS" --output-dir audit_outputs
          python src/collect/group_issues.py --input audit_outputs/sample_sweloc.jsonl --output audit_outputs/issue_level.jsonl
      - name: Install embedding backend
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install sentence-transformers==3.4.1 transformers==4.51.3 einops
      - name: Restore previous LLM judgments for reuse
        run: |
          set -euo pipefail
          TODAY="$(TZ=Asia/Bangkok date +%F)"
          REPO_NAME="${TARGET_REPO//\//__}"
          mkdir -p audit_outputs
          if [[ -f "audit_results/$TODAY/$REPO_NAME/llm_judge_cache.json" ]]; then
            cp "audit_results/$TODAY/$REPO_NAME/llm_judge_cache.json" audit_outputs/llm_judge_cache.json
          fi
      - name: Compute cosine and optional LLM judgments
        run: |
          set -euo pipefail
          opts=(--embedding)
          if [[ -n "$OPENAI_API_KEY" ]]; then opts+=(--judge); else echo "No OPENAI_API_KEY, LLM judge will remain not_run"; fi
          python src/collect/enrich_sweloc.py --input audit_outputs/sample_sweloc.jsonl --output-dir audit_outputs --max-judge-pairs 8 --max-llm-calls 1 --llm-cache audit_outputs/llm_judge_cache.json "${opts[@]}"
          python src/collect/group_issues.py --input audit_outputs/enriched_sweloc.jsonl --output audit_outputs/issue_level_enriched.jsonl
      - name: Validate data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('audit_outputs')
          rows=[json.loads(line) for line in (p/'enriched_sweloc.jsonl').read_text().splitlines() if line.strip()]
          if not rows: raise SystemExit('No samples generated')
          if not any(x.get('semantic_status')=='computed' for x in rows):
              raise SystemExit('No real embedding scores were computed')
          if sum(f.stat().st_size for f in p.iterdir() if f.is_file()) > 10000000:
              raise SystemExit('Audit snapshot exceeds Git size limit')
          print('Rows:',len(rows),'real cosine:',sum(x['semantic_status']=='computed' for x in rows))
          PY
      - name: Save dated dataset to repo
        run: |
          set -euo pipefail
          TODAY="$(TZ=Asia/Bangkok date +%F)"
          REPO_NAME="${TARGET_REPO//\//__}"
          OUTPUT="audit_results/$TODAY/$REPO_NAME"
          mkdir -p "$OUTPUT"
          cp audit_outputs/* "$OUTPUT/"
          python - "$OUTPUT" <<'PY'
          import json,sys,os,pathlib
          p=pathlib.Path(sys.argv[1])
          metadata=json.loads((p/'enrichment_metadata.json').read_text())
          metadata.update({'run_id':os.environ['GITHUB_RUN_ID'],'source_commit':os.environ['GITHUB_SHA'],
                           'repo':os.environ['TARGET_REPO'],'date_timezone':'Asia/Bangkok'})
          (p/'metadata.json').write_text(json.dumps(metadata,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- "$OUTPUT"
          git commit -m "data: SWELOC audit for $TODAY $REPO_NAME [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload artifact backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweloc-mini-audit
          path: audit_outputs/
          if-no-files-found: warn
