name: ET1 SweRankEmbed-Small full query ablation (198 frozen issues)

on:
  push:
    branches: [experiment/et1-single-root-full-query]
    paths:
      - '.github/workflows/et1-full-query-198.yml'
      - 'src/collect/evaluate_et1_full_query_ablation.py'
      - 'src/collect/aggregate_et1_full_query_ablation.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate scripts
        run: |
          python -m py_compile src/collect/evaluate_et1_full_query_ablation.py src/collect/aggregate_et1_full_query_ablation.py
      - uses: actions/download-artifact@v4
        with:
          name: et1-combined-100repo-results
          github-token: ${{ github.token }}
          run-id: 44733396537
          path: frozen/v1
      - uses: actions/download-artifact@v4
        with:
          name: et1-v2-comparison-198
          github-token: ${{ github.token }}
          run-id: 44904454601
          path: frozen/v2
      - name: Verify exact 198 issue, 35 changed queries, same baseline target
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          def read(path):
              return [json.loads(x) for x in Path(path).read_text().splitlines() if x.strip()]
          gold=read("frozen/v1/issues_single_root.jsonl")
          v1=read("frozen/v1/et1_path_candidates.jsonl")
          v2=read("frozen/v2/compare_198.jsonl")
          assert len(gold)==len(v1)==len(v2)==198
          assert {x["instance_id"] for x in gold}=={x["instance_id"] for x in v1}=={x["instance_id"] for x in v2}
          assert sum(len(x["query"])>3000 for x in gold)==35
          assert {x["instance_id"]:x["target"] for x in gold}=={x["instance_id"]:x["target"] for x in v2}
          print("FROZEN_DATA_VERIFIED samples=198 affected=35")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: et1-full-query-frozen-input
          path: frozen
          retention-days: 30

  reembed:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0,1,2,3,4]
    env:
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '4'
      HF_HUB_DOWNLOAD_TIMEOUT: '180'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          name: et1-full-query-frozen-input
          path: frozen
      - name: Install real Salesforce SweRankEmbed-Small runtime (CPU)
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install sentence-transformers==3.4.1 transformers==4.51.3 einops numpy
      - name: Rerank full descriptions, compare same 3000 character baseline and graph
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python src/collect/evaluate_et1_full_query_ablation.py \
            --issues frozen/v1/issues_single_root.jsonl \
            --baseline-v1 frozen/v1/et1_path_candidates.jsonl \
            --baseline-v2 frozen/v2/compare_198.jsonl \
            --output "out/shard-${SHARD}" \
            --shard-index "${SHARD}" --shard-count 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: et1-full-query-shard-${{ matrix.shard }}
          path: out/shard-${{ matrix.shard }}
          retention-days: 30
          if-no-files-found: warn

  aggregate:
    needs: reembed
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          name: et1-full-query-frozen-input
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: et1-full-query-shard-*
          path: all-shards
      - name: Aggregate 198 samples (strictly fail on any missing affected query)
        run: |
          python src/collect/aggregate_et1_full_query_ablation.py \
            --issues frozen/v1/issues_single_root.jsonl \
            --baseline-v2 frozen/v2/compare_198.jsonl \
            --shards all-shards \
            --output combined
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: et1-198-full-query-vs-3000-comparison
          path: combined
          retention-days: 30
          if-no-files-found: warn
