name: Full All Modified Functions Graph Navigation (no LLM)
on:
  push:
    branches: [experiment/all-pr-graph-navigation-no-llm]
    paths:
      - '.github/workflows/all-pr-graph-navigation-no-llm.yml'
      - 'src/collect/evaluate_all_pr_graph_cases.py'
      - 'docs/TARGET_PAIR_LEVEL_EVALUATION.md'
  workflow_dispatch:
    inputs:
      max_prs:
        description: Max merged issue-linked PRs per repository
        required: true
        default: '5'
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: all-modified-graph-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Test diff-context exclusions and graph cases without LLM
        run: |
          python -m unittest discover -s tests -p test_collect_all_pr_functions.py -v
          python -m unittest discover -s tests -p test_all_pr_graph_cases.py -v
  crawl:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {repo: 'pypa/packaging', slug: 'pypa__packaging'}
          - {repo: 'encode/httpx', slug: 'encode__httpx'}
          - {repo: 'Textualize/rich', slug: 'Textualize__rich'}
          - {repo: 'pallets/werkzeug', slug: 'pallets__werkzeug'}
          - {repo: 'pallets/itsdangerous', slug: 'pallets__itsdangerous'}
          - {repo: 'simonw/datasette', slug: 'simonw__datasette'}
          - {repo: 'simonw/sqlite-utils', slug: 'simonw__sqlite-utils'}
          - {repo: 'agronholm/anyio', slug: 'agronholm__anyio'}
          - {repo: 'django-commons/django-debug-toolbar', slug: 'django-commons__django-debug-toolbar'}
          - {repo: 'fastapi/fastapi', slug: 'fastapi__fastapi'}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install benchmark datasets loader
        run: python -m pip install 'datasets>=3,<5' 'huggingface_hub>=0.25,<2'
      - name: Build strict SWE-bench and LocBench repository exclusion manifest
        run: python src/collect/build_benchmark_exclusions.py --output out/benchmark_exclusions.json
      - name: Crawl every edited function from merged issue-linked PRs
        env:
          TARGET_REPO: ${{ matrix.repo }}
          MAX_PRS: ${{ inputs.max_prs || '5' }}
        run: |
          python src/collect/collect_all_pr_functions.py \
            --repo "$TARGET_REPO" --max-prs "$MAX_PRS" \
            --exclusions out/benchmark_exclusions.json \
            --output out/all_pr_functions.jsonl
      - name: Install SweRankEmbed CPU dependencies (no OpenAI key)
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install sentence-transformers==3.4.1 transformers==4.51.3 einops numpy
      - name: Rank ALL functions, including tests, at original base commit
        run: |
          python src/collect/retrieve_with_swerankembed.py \
            --input out/all_pr_functions.jsonl \
            --output out/swerankembed_rankings.jsonl \
            --metadata out/index_metadata.json
      - name: Run complete graph navigation across ALL modified PR target functions
        run: |
          python src/collect/evaluate_all_pr_graph_cases.py \
            --gold out/all_pr_functions.jsonl \
            --rankings out/swerankembed_rankings.jsonl \
            --output out/graph_navigation \
            --top-k 10 --max-hops 8 --reverse-hops 5
      - name: Upload real dataset and graph navigation cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-modified-graph-${{ matrix.slug }}
          path: out/
          if-no-files-found: warn
          retention-days: 30
