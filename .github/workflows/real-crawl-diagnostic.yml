name: Real crawl diagnostic
on:
  push:
    branches:
      - experiment/all-pr-modified-functions-no-llm
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python --version
      - run: python -m unittest discover -s tests -p test_collect_all_pr_functions.py -v
      - name: Inspect repository benchmark exclusions
        run: |
          python -m pip install datasets huggingface_hub
          python src/collect/build_benchmark_exclusions.py --output out/exclusions.json
      - name: Crawl two merged issue-linked PRs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python src/collect/collect_all_pr_functions.py --exclusions out/exclusions.json --max-prs 2 --repo pypa/packaging --output out/all_pr_functions.jsonl
      - name: Backup diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-crawl-diagnostic
          path: out/
          if-no-files-found: warn
