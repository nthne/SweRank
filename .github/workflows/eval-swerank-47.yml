name: Frozen 47 cases — SweRankEmbed vs BM25
on:
  push:
    branches: ['feature/issue-graph-navigation-dataset']
    paths:
      - '.github/workflows/eval-swerank-47.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: eval-swerank-47-${{ github.ref }}
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {repo: 'simonw/datasette', slug: 'simonw__datasette'}
          - {repo: 'Textualize/rich', slug: 'Textualize__rich'}
          - {repo: 'pypa/packaging', slug: 'pypa__packaging'}
          - {repo: 'pallets/itsdangerous', slug: 'pallets__itsdangerous'}
          - {repo: 'django-commons/django-debug-toolbar', slug: 'django-commons__django-debug-toolbar'}
          - {repo: 'encode/httpx', slug: 'encode__httpx'}
          - {repo: 'pallets/werkzeug', slug: 'pallets__werkzeug'}
          - {repo: 'pypa/build', slug: 'pypa__build'}
          - {repo: 'fastapi/fastapi', slug: 'fastapi__fastapi'}
    env:
      OMP_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: nav-repo-${{ matrix.slug }}
          repository: nthne/SweRank
          run-id: 42153623735
          github-token: ${{ github.token }}
          path: frozen_input/
      - name: Install SweRankEmbed on CPU
        if: matrix.repo != 'pypa/build'
        run: |
          python -m pip install 'einops>=0.8'
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install sentence-transformers==3.4.1 transformers==4.51.3
      - name: Evaluate immutable issue and target labels, recompute BM25 and SweRank
        run: |
          set -euo pipefail
          python src/collect/eval_swerank_47.py repo \
            --input frozen_input/ \
            --reference navigation_results/2026-11-06/multi_repo_batch/combined_navigation_cases.jsonl \
            --repo ${{ matrix.repo }} \
            --output results/${{ matrix.slug }}/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-swerank-47-${{ matrix.slug }}
          path: results/${{ matrix.slug }}/
          if-no-files-found: warn
          retention-days: 30
  aggregate:
    needs: evaluate
    if: needs.evaluate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: eval-swerank-47-*
          path: artifacts/
          merge-multiple: false
      - name: Aggregate and validate all 47 frozen cases and target IDs
        run: |
          python src/collect/eval_swerank_47.py merge \
            --input artifacts/ \
            --reference navigation_results/2026-11-06/multi_repo_batch/combined_navigation_cases.jsonl \
            --output final/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-swerank-47-combined-${{ github.run_id }}
          path: final/
          if-no-files-found: warn
      - name: Commit comparison datasets and official SweRank training examples
        run: |
          set -euo pipefail
          OUT=navigation_results/2026-11-10/swerank_vs_bm25_frozen47
          mkdir -p "$OUT"
          cp final/* "$OUT/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin feature/issue-graph-navigation-dataset
          git reset --mixed origin/feature/issue-graph-navigation-dataset
          git add -f -- "$OUT"
          if ! git diff --cached --quiet; then
            git commit -m 'data: frozen47 SweRankEmbed vs BM25 reranking [skip ci]'
            git push origin HEAD:feature/issue-graph-navigation-dataset
          fi