name: All PR functions (no LLM)
on:
  push:
    branches: [experiment/all-pr-modified-functions-no-llm]
  workflow_dispatch:
    inputs:
      repositories:
        description: Comma-separated owner/repo list
        required: true
        default: pypa/packaging,encode/httpx
      max_prs:
        description: Merged issue-linked PRs per repository
        required: true
        default: '10'
permissions:
  contents: read
jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_collect_all_pr_functions.py -v
  collect:
    needs: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'datasets>=3,<5' 'huggingface_hub>=0.25,<2'
      - name: Generate benchmark exclusion manifest
        run: python src/collect/build_benchmark_exclusions.py --output out/benchmark_exclusions.json
      - name: Collect without LLM or similarity filtering
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOS: ${{ inputs.repositories || 'pypa/packaging,encode/httpx,python-trio/sniffio' }}
          MAX_PRS: ${{ inputs.max_prs || '3' }}
        run: |
          python - <<'PY'
          import os, subprocess
          names=[s.strip() for s in os.environ['REPOS'].split(',') if s.strip()]
          if not names: raise SystemExit('No repositories specified')
          command=['python','src/collect/collect_all_pr_functions.py',
                   '--exclusions','out/benchmark_exclusions.json',
                   '--max-prs',os.environ['MAX_PRS'],
                   '--output','out/all_pr_functions.jsonl']
          for name in names: command.extend(['--repo',name])
          subprocess.run(command,check=True)
          PY
      - name: Install SweRankEmbed retrieval backend
        run: |
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install sentence-transformers==3.4.1 transformers==4.51.3 einops numpy
      - name: Build full base-commit function retrieval
        run: |
          python src/collect/retrieve_with_swerankembed.py --input out/all_pr_functions.jsonl --output out/swerankembed_rankings.jsonl --metadata out/index_metadata.json
      - name: Evaluate against all modified functions
        run: |
          python src/collect/evaluate_all_pr_targets.py --gold out/all_pr_functions.jsonl --rankings out/swerankembed_rankings.jsonl --output out/evaluation.json
      - name: Upload dataset and exclusions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-pr-functions-no-llm
          path: out/
          if-no-files-found: warn
